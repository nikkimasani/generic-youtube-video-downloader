<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101520"><title>ClipKit</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#101520;color:#f5f6f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#27476d 0,transparent 31rem),#101520}main{max-width:900px;margin:auto;padding:64px 24px}.eyebrow{color:#82d9ff;text-transform:uppercase;letter-spacing:.13em;font-size:.75rem;font-weight:700}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.07em;line-height:.94;margin:13px 0 18px}.intro{max-width:590px;color:#c4cfdd;font-size:1.08rem;line-height:1.6}.card{margin-top:42px;padding:28px;border:1px solid #3c4b60;border-radius:20px;background:#18212ecc;box-shadow:0 24px 70px #0005}label{display:block;margin:19px 0 8px;color:#dbe5ef;font-weight:650}input,select,button{font:inherit;border-radius:11px;border:1px solid #506278}input,select{width:100%;padding:13px;background:#0d141f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{margin-top:25px;padding:14px 20px;background:#75dafd;color:#07121e;border:0;cursor:pointer;font-weight:800}button:disabled{opacity:.6;cursor:wait}#status{min-height:25px;margin:18px 0 0;color:#b8c8d8}.note{margin:18px 0 0;color:#91a1b3;font-size:.85rem;line-height:1.5}@media(max-width:600px){main{padding:42px 17px}.card{padding:20px}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">Private downloads · powered by yt-dlp</div><h1>Save what’s yours.</h1><p class="intro">Download media you own or are permitted to save. Files stream directly to your browser and are not stored by ClipKit.</p><form class="card" id="download-form"><label for="url">Video or audio link</label><input id="url" type="url" required placeholder="https://…"><div class="grid"><div><label for="kind">Download</label><select id="kind"><option value="video">Video</option><option value="audio">Audio</option></select></div><div><label for="quality">Maximum video quality</label><select id="quality"><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select></div></div><button id="submit" type="submit">Download</button><div id="status" aria-live="polite"></div><p class="note">Only use ClipKit for material you own or have permission to save. It does not bypass DRM or access controls.</p></form></main><script>
const form=document.querySelector('#download-form'),status=document.querySelector('#status'),button=document.querySelector('#submit');form.addEventListener('submit',async(e)=>{e.preventDefault();button.disabled=true;status.textContent='Preparing your download…';const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value,kind:kind.value,quality:quality.value})});if(!r.ok){const body=await r.json();status.textContent=body.error||'Download failed.';button.disabled=false;return}const blob=await r.blob(),disposition=r.headers.get('content-disposition')||'',match=disposition.match(/filename="?([^";]+)/),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=match?match[1]:'clipkit-download';a.click();URL.revokeObjectURL(a.href);status.textContent='Your download is ready.';button.disabled=false});
</script></body></html>
